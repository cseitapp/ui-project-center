services:
  api:
    image: ui-cse-project-center:v1.1
    build:
      context: .
      dockerfile: ./Dockerfile
    # .env.production must define NUXT_SESSION_PASSWORD,
    # NUXT_AUTH_COOKIE_NAME, and NUXT_COOKIE_LIFE at runtime.
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
  # ports:
  #   - 2000:2000

  nginx:
    container_name: nginx-ui-cse-project-center
    image: nginx:latest
    volumes:
      - ./conf.d:/etc/nginx/conf.d
    depends_on:
      - api
    ports:
      - 2000:2000
