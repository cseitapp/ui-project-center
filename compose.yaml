services:
  api:
    image: ui-cse-project-center:v1.1
    build:
      context: .
      dockerfile: ./Dockerfile
    # .env.production must define NUXT_SESSION_PASSWORD,
    # NUXT_AUTH_COOKIE_NAME, and NUXT_COOKIE_LIFE at runtime.
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
  # ports:
  #   - 2000:2000

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    container_name: nginx-ui-cse-project-center
    image: nginx:latest
    volumes:
      - ./conf.d:/etc/nginx/conf.d
    depends_on:
      - api
    ports:
      - 2000:2000

volumes:
  redis-data:
